name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. The point is not the code — which does not change on its own —
    # but the dependencies: bioconda moves under us, and this is what catches
    # a tool release that breaks the environment before a user does.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Fast feedback: the parsing functions, on every platform and both ends
  # of the supported Python range. No bioinformatics tools, no database,
  # no conda — runs in about a minute.
  # ---------------------------------------------------------------------
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Intel macOS (macos-13) is deliberately absent: its runners are
        # scarce enough that jobs sat queued for over an hour, which in
        # practice means nobody reads the result. osx-64 packages exist for
        # every dependency but are not exercised here.
        os: [ubuntu-latest, macos-14]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # The whole directory, not one file. Naming test_parsers.py explicitly
      # meant test_perf_report.py -- 31 of the 53 tests -- never ran here, so
      # the performance report was the least covered part of the code in CI
      # despite being the best covered by tests.
      - name: Run unit tests
        run: python -m pytest test/ -v

      - name: Check every script at least parses
        run: |
          for f in $(git ls-files '*.py'); do
            python -m py_compile "$f" || exit 1
          done
          for f in bin/nano16s install.sh; do
            bash -n "$f" || exit 1
          done

  # ---------------------------------------------------------------------
  # ruff.toml and .pre-commit-config.yaml already define the linting, but
  # pre-commit is opt-in ("Optional, but recommended"), so nothing enforced
  # it on a contributor who had not installed the hooks. This runs the same
  # two linters with the same configuration, once, in about fifteen seconds.
  # ---------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the linters
        run: python -m pip install --upgrade pip ruff shellcheck-py

      # Reads ruff.toml, so this cannot drift from what pre-commit does.
      - name: ruff
        run: ruff check .

      # Same file set as the shellcheck pre-commit hook.
      - name: shellcheck
        run: shellcheck bin/nano16s install.sh

  # ---------------------------------------------------------------------
  # Does the documented install actually work on a clean machine? This is
  # the check that would have caught the symlink bug, where the installed
  # command resolved its own location to the conda prefix instead of the
  # repository.
  # ---------------------------------------------------------------------
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    timeout-minutes: 45
    defaults:
      run:
        # -l so the runner's preinstalled conda is initialised, matching what
        # a user has after installing Miniforge.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT pre-building the environment here. An earlier version
      # used setup-micromamba, which created and activated the environment
      # before install.sh ran; install.sh then found the runner's separate
      # Miniconda, built a *second* environment under it, and symlinked the
      # command into a prefix that was not on PATH. The job failed with
      # "nano16s: command not found" while install.sh reported success.
      #
      # The point of this job is to walk the path the README documents, so it
      # lets install.sh do the whole job, exactly as a user would.
      # The README's Requirements section says you need Miniforge or another
      # conda. Runner images are inconsistent about this — ubuntu-latest ships
      # Miniconda, macos-14 ships nothing — so rather than depend on whatever
      # happens to be preinstalled, install Miniforge exactly as a new user
      # would. That makes this job test the documented prerequisite as well as
      # the installer.
      - name: Install Miniforge if the runner has no conda
        run: |
          # No `exit` here. These steps run under `bash -el`, and an explicit
          # exit in a *login* shell had its status overridden on the Linux
          # runner: the step printed "conda already present" and then reported
          # exit code 1. An if/else has no such trapdoor.
          if command -v conda >/dev/null; then
            echo "conda already present: $(conda --version)"
          else
            case "$(uname -s)-$(uname -m)" in
              Darwin-arm64)  SFX=MacOSX-arm64 ;;
              Darwin-x86_64) SFX=MacOSX-x86_64 ;;
              Linux-x86_64)  SFX=Linux-x86_64 ;;
              Linux-aarch64) SFX=Linux-aarch64 ;;
              *) echo "unsupported platform: $(uname -s)-$(uname -m)" >&2; false ;;
            esac
            curl -fsSL -o /tmp/miniforge.sh \
              "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-${SFX}.sh"
            bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
            echo "$HOME/miniforge3/bin" >> "$GITHUB_PATH"
            echo "installed Miniforge for ${SFX}"
          fi

      - name: Install the way the README says to
        run: |
          conda --version
          bash install.sh
          # `conda activate` needs conda's shell function, which a user gets
          # from `conda init` when they install Miniforge but a CI runner does
          # not have. Sourcing the profile script is the equivalent, and is
          # what any non-interactive script needs to do.
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate nano16s
          echo "CONDA_PREFIX=$CONDA_PREFIX"

      - name: Every tool runs on this platform
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate nano16s
          for t in emu minimap2 samtools chopper porechop_abi NanoStat snakemake; do
            command -v "$t" >/dev/null || { echo "MISSING: $t"; exit 1; }
          done
          minimap2 --version && samtools --version | head -1
          chopper --version && porechop_abi --version
          NanoStat --version && emu --version && snakemake --version

      - name: The command is on PATH and resolves the repository, not the env
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate nano16s
          # Invoked through the symlink install.sh created, which is how a real
          # user runs it. If ROOT resolves to the environment prefix instead of
          # the checkout, these fail with "can't open file" or "demo data not
          # found" rather than the clean error we assert below.
          nano16s --version
          nano16s --help > /dev/null
          nano16s db list

      - name: With no database installed it refuses clearly
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate nano16s
          set +e
          OUT="$(nano16s -d test/demo/fastq_pass -o "$RUNNER_TEMP/out" -y 2>&1)"
          RC=$?
          set -e
          echo "$OUT" | tail -3
          [ "$RC" -ne 0 ] || { echo "expected a non-zero exit"; exit 1; }
          echo "$OUT" | grep -qi 'no emu database found'

      - name: The workflow graph builds
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate nano16s
          mkdir -p "$RUNNER_TEMP/fakedb"
          printf 'tax_id\tspecies\n'  > "$RUNNER_TEMP/fakedb/taxonomy.tsv"
          printf '>1\nACGT\n'         > "$RUNNER_TEMP/fakedb/species_taxid.fasta"
          nano16s -d test/demo/fastq_pass -o "$RUNNER_TEMP/dry" \
                  --db "$RUNNER_TEMP/fakedb" -n -y

      - name: No package came from Anaconda's defaults channel
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate nano16s
          if conda list --json | grep -qi '"channel": *"pkgs/'; then
            echo "A package resolved from defaults despite nodefaults:"
            conda list | grep -i 'pkgs/' || true
            exit 1
          fi
          echo "all packages from conda-forge / bioconda"

  # ---------------------------------------------------------------------
  # The real thing: build the database from NCBI and run the pipeline on
  # the bundled demo. Slow (~45 min, mostly Porechop) and depends on an
  # external FTP server, so it is not on the push path — weekly and on
  # demand only.
  # ---------------------------------------------------------------------
  pipeline:
    name: full pipeline (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install Miniforge if the runner has no conda
        run: |
          if command -v conda >/dev/null; then
            echo "conda already present: $(conda --version)"
          else
            curl -fsSL -o /tmp/miniforge.sh \
              "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh"
            bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
            echo "$HOME/miniforge3/bin" >> "$GITHUB_PATH"
          fi

      # Same reasoning as the install job: let install.sh build the
      # environment itself rather than handing it a pre-built one, so this
      # exercises the path the README documents.
      - name: Install
        run: bash install.sh

      - name: Build the reference database from NCBI
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate nano16s
          nano16s db build
          nano16s db list

      # `nano16s test` picks its own output directory with
      # `mktemp -d "${TMPDIR:-/tmp}/nano16s_test_XXXXXX"`. Pointing TMPDIR at a
      # directory we name means the upload step below can glob for it rather
      # than assume /tmp, which is only correct while the runner leaves TMPDIR
      # unset.
      - name: Run the bundled demo end to end
        env:
          TMPDIR: ${{ runner.temp }}/demo
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate nano16s
          mkdir -p "$TMPDIR"
          nano16s test

      # upload-artifact's if-no-files-found is all-or-nothing: it reports on the
      # patterns collectively, so a single pattern matching nothing still
      # uploads a green, quietly incomplete artifact. That is exactly how the
      # performance report stayed missing from every artifact since it was
      # added. Assert the list here, where each name is checked on its own.
      - name: Every file the artifact promises exists
        # Plain bash, not the job's `bash -el`. A *login* shell sources
        # ~/.bash_logout on the way out, and Ubuntu's runs `clear_console -q`,
        # which fails with no terminal attached and takes the shell's exit
        # status with it -- so `exit 0` leaves the step reporting 1. The check
        # below found all five files and 36 benchmark records and still failed
        # the job. Nothing here needs conda, so the login shell buys nothing.
        shell: bash
        run: |
          # A glob rather than `ls | head`: `shell: bash` adds pipefail, under
          # which a pipe whose left side is cut short by `head` fails the step.
          shopt -s nullglob
          DIRS=("${{ runner.temp }}"/demo/nano16s_test_*/)
          if [ "${#DIRS[@]}" -eq 0 ]; then
            echo "no run directory under ${{ runner.temp }}/demo -- TMPDIR was not honoured"
            exit 1
          fi
          RUN_DIR="${DIRS[0]%/}"
          echo "run directory: $RUN_DIR"
          MISSING=0
          for f in nano16s_report.html \
                   performance_report.html \
                   performance_summary.csv \
                   performance.json \
                   preprocessing_summary.csv; do
            if [ -s "$RUN_DIR/$f" ]; then
              echo "  ok      $f ($(wc -c < "$RUN_DIR/$f") bytes)"
            else
              echo "  MISSING $f"
              MISSING=1
            fi
          done
          # Six per-sample rules record one benchmark each per barcode. Zero
          # here means the timings behind the performance report were never
          # written, which leaves the report rendering but hollow.
          N_BENCH="$(find "$RUN_DIR/benchmarks" -name '*.tsv' 2>/dev/null | wc -l)"
          echo "  benchmark records: $N_BENCH"
          [ "$N_BENCH" -gt 0 ] || MISSING=1
          exit "$MISSING"

      - name: Keep the report and tables for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: |
            ${{ runner.temp }}/demo/nano16s_test_*/nano16s_report.html
            ${{ runner.temp }}/demo/nano16s_test_*/performance_report.html
            ${{ runner.temp }}/demo/nano16s_test_*/performance_summary.csv
            ${{ runner.temp }}/demo/nano16s_test_*/performance.json
            ${{ runner.temp }}/demo/nano16s_test_*/preprocessing_summary.csv
            ${{ runner.temp }}/demo/nano16s_test_*/benchmarks/
            ${{ runner.temp }}/demo/nano16s_test_*/07_emu_combined/
          # Catches the whole directory having moved -- if TMPDIR stops being
          # honoured, every pattern misses at once and this fails rather than
          # publishing an empty artifact.
          if-no-files-found: error
          retention-days: 14
